<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>@</title>
  <!-- Syne for main, Space Mono for mono details, original font stack restored for dns.spoof -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #fff;
      --border: rgba(255,255,255,0.12);
      --border-hover: rgba(255,255,255,0.25);
      --muted: rgba(255,255,255,0.38);
      --dim: rgba(255,255,255,0.07);
      --card-bg: rgba(8,8,8,0.55);
      --r: 18px;
    }

    html, body {
      background: #000;
      color: #fff;
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════
       ENTRY SCREEN – IP display & click text
    ═══════════════════════════════════════════ */
    #entry {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity .65s ease;
      gap: 10px;
    }
    #entry.hide { opacity: 0; pointer-events: none; }

    #sparkle-canvas {
      position: fixed; inset: 0; z-index: 9998; pointer-events: none;
    }

    .ip-display {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: 0.5px;
      color: #fff;
      text-align: center;
      line-height: 1.2;
      user-select: none;
      position: relative;
      z-index: 2;
      background: transparent;
      text-shadow: none;
    }

    .click-hint {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.65);
      font-family: 'Syne', sans-serif;
      text-transform: uppercase;
      margin-top: 6px;
      user-select: none;
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    /* ═══════════════════════════════════════════
       VIDEO BG
    ═══════════════════════════════════════════ */
    #bg-video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 1;
      z-index: 0;
      pointer-events: none;
    }

    .video-overlay {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.18) 0%, rgba(0,0,0,.55) 100%);
    }

    /* ═══════════════════════════════════════════
       MAIN WRAPPER
    ═══════════════════════════════════════════ */
    #main {
      position: relative; z-index: 2;
      opacity: 0;
      transition: opacity .8s ease .15s;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    #main.show { opacity: 1; }

    .tilt-scene {
      perspective: 900px;
      width: 100%;
      max-width: 420px;
    }

    .tilt-card {
      width: 100%;
      transform-style: preserve-3d;
      transform: rotateX(0deg) rotateY(0deg);
      transition: transform .08s ease-out, box-shadow .08s ease-out;
      will-change: transform;
      border-radius: var(--r);
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 20px 60px rgba(0,0,0,.7), 0 4px 16px rgba(0,0,0,.5);
      overflow: hidden;
    }

    .tilt-card::before {
      content: '';
      position: absolute; inset: 0; z-index: 10;
      border-radius: var(--r);
      background: radial-gradient(circle at var(--mx,50%) var(--my,30%), rgba(255,255,255,.07) 0%, transparent 65%);
      pointer-events: none;
      transition: background .06s;
    }

    .card-inner {
      padding: 22px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ════════════════════════════════
       PROFILE SECTION
    ════════════════════════════════ */
    .profile-section {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
    }

    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 70px; height: 70px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid rgba(255,255,255,.18);
    }

    .avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255,255,255,.22);
      animation: spin 10s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .profile-info { flex: 1; min-width: 0; }

    .username-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .username {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    /* icon.png ONLY next to lenzy text */
    .username-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      margin-left: 2px;
    }

    .badge-img {
      width: 15px; height: 15px;
      object-fit: contain;
      margin-left: 2px;
    }

    .tagline {
      margin-top: 5px;
      font-size: .72rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-row {
      display: flex; gap: 8px;
      margin-top: 10px;
    }
    .icon-pill {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--dim);
      border: 1px solid var(--border);
      transition: background .18s, transform .18s;
      text-decoration: none;
    }
    .icon-pill:hover {
      background: rgba(255,255,255,.13);
      transform: translateY(-2px);
    }
    .icon-pill img {
      width: 16px; height: 16px;
      object-fit: contain;
      filter: brightness(0) invert(1) opacity(.65);
    }

    .sep {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 30%, var(--border) 70%, transparent);
      margin: 0 -22px;
    }

    /* ════════════════════════════════
       SOCIAL SECTION – dns.spoof restored to original font
    ════════════════════════════════ */
    .social-section {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 16px 0;
    }

    .social-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255,255,255,.13);
      flex-shrink: 0;
    }

    .social-info { flex: 1; min-width: 0; }

    .social-name {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    /* dns.spoof uses original Syne font (same as before) */
    .dns-spoof-text {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      letter-spacing: 0;
      color: #fff;
    }

    .social-icons-inline {
      display: flex; gap: 3px; align-items: center;
    }
    .social-icons-inline img {
      width: 14px; height: 14px;
      object-fit: contain;
      filter: brightness(0) invert(1) opacity(.5);
    }

    .social-status {
      margin-top: 3px;
      font-size: .7rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-style: italic;
    }

    /* ════════════════════════════════
       AUDIO PLAYER
    ════════════════════════════════ */
    .audio-section {
      padding-top: 16px;
    }

    .audio-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .audio-art {
      width: 40px; height: 40px;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .audio-art svg {
      width: 20px; height: 20px;
      fill: rgba(255,255,255,.45);
    }

    .audio-meta { flex: 1; min-width: 0; }
    .audio-title {
      font-size: .88rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .audio-sub {
      font-size: .68rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      margin-top: 2px;
    }

    .prog-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 13px;
    }
    .t {
      font-size: .66rem;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      flex-shrink: 0; width: 30px;
    }
    .t.r { text-align: right; }
    .prog-track {
      flex: 1; height: 3px;
      background: rgba(255,255,255,.13);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
    }
    .prog-fill {
      height: 100%; width: 0%;
      background: #fff;
      border-radius: 99px;
      pointer-events: none;
      transition: width .25s linear;
    }
    .prog-thumb {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 10px; height: 10px;
      background: #fff;
      border-radius: 50%;
      left: 0%;
      margin-left: -5px;
      pointer-events: none;
      transition: left .25s linear;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 12px;
    }
    .cbtn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.5);
      padding: 6px;
      display: flex; align-items: center;
      transition: color .18s, transform .15s;
      border-radius: 50%;
    }
    .cbtn:hover { color: #fff; transform: scale(1.12); }
    .cbtn.play {
      width: 40px; height: 40px;
      background: #fff; color: #000;
      justify-content: center;
    }
    .cbtn.play:hover { background: #e0e0e0; transform: scale(1.07); }
    .cbtn svg { display: block; pointer-events: none; }

    .vol-row {
      display: flex; align-items: center; gap: 8px;
    }
    .vol-row svg { color: var(--muted); flex-shrink: 0; }
    input[type=range].vol {
      flex: 1; -webkit-appearance: none;
      height: 3px;
      background: rgba(255,255,255,.13);
      border-radius: 99px; outline: none; cursor: pointer;
    }
    input[type=range].vol::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px; height: 11px;
      border-radius: 50%; background: #fff; cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ENTRY with IP and click text -->
<canvas id="sparkle-canvas"></canvas>
<div id="entry">
  <div class="ip-display" id="visitor-ip">Loading IP...</div>
  <div class="click-hint">click to enter</div>
</div>

<!-- VIDEO -->
<video id="bg-video" src="video.mp4" muted loop playsinline></video>
<div class="video-overlay"></div>

<!-- MAIN CARD -->
<div id="main">
  <div class="tilt-scene">
    <div class="tilt-card" id="tiltCard">
      <div class="card-inner">

        <!-- PROFILE -->
        <div class="profile-section">
          <div class="avatar-wrap">
            <img class="avatar" src="pfp.jpg" alt="pfp"
              onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2270%22 height=%2270%22><rect width=%2270%22 height=%2270%22 fill=%22%23181818%22 rx=%2235%22/></svg>'"/>
            <div class="avatar-ring"></div>
          </div>
          <div class="profile-info">
            <div class="username-row">
              <span class="username">Lenzy</span>
              <!-- icon.png ONLY next to lenzy text -->
              <img class="username-icon" src="icon.png" alt="icon" onerror="this.style.display='none'"/>
            </div>
            <div class="tagline">www.ethone.net</div>
            <div class="icon-row">
              <a class="icon-pill" href="#">
                <img src="" alt="" onerror="this.parentElement.style.display='none'"/>
              </a>
            </div>
          </div>
        </div>

        <div class="sep"></div>

        <!-- SOCIAL – dns.spoof with original font (Syne) -->
        <div class="social-section">
          <img class="social-avatar" src="pfp2.jpg" alt="pfp2"
            onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2244%22 height=%2244%22><rect width=%2244%22 height=%2244%22 fill=%22%23181818%22 rx=%2222%22/></svg>'"/>
          <div class="social-info">
            <div class="social-name">
              <span class="dns-spoof-text">dns.spoof</span>
              <span class="social-icons-inline">
                <img src="icon1.png" alt="" onerror="this.style.display='none'"/>
                <img src="icon2.png" alt="" onerror="this.style.display='none'"/>
              </span>
            </div>
            <div class="social-status">last seen 2 hours ago</div>
          </div>
        </div>

        <div class="sep"></div>

        <!-- AUDIO -->
        <div class="audio-section">
          <div class="audio-header">
            <div class="audio-art">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
              </svg>
            </div>
            <div class="audio-meta">
              <div class="audio-title" id="track-title">Flex Flex</div>
              <div class="audio-sub" id="track-sub">OsamaSon</div>
            </div>
          </div>

          <div class="prog-row">
            <span class="t" id="t-cur">0:00</span>
            <div class="prog-track" id="prog-track">
              <div class="prog-fill" id="prog-fill"></div>
              <div class="prog-thumb" id="prog-thumb"></div>
            </div>
            <span class="t r" id="t-dur">0:00</span>
          </div>

          <div class="controls">
            <button class="cbtn" id="btn-restart" title="Restart">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
              </svg>
            </button>
            <button class="cbtn play" id="btn-play" title="Play / Pause">
              <svg id="ic-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg id="ic-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>
            <button class="cbtn" id="btn-mute" title="Mute / Unmute">
              <svg id="ic-vol" width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77 0-4.28-2.99-7.86-7-8.77z"/>
              </svg>
              <svg id="ic-muted" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>
              </svg>
            </button>
          </div>

          <div class="vol-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.5 12A4.5 4.5 0 0 0 16 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>
            </svg>
            <input type="range" class="vol" id="vol-slider" min="0" max="1" step="0.01" value="1"/>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────
   FETCH VISITOR IP (display only, not stored)
───────────────────────────────────────────── */
(async () => {
  const ipEl = document.getElementById('visitor-ip');
  try {
    const response = await fetch('https://api.ipify.org?format=json');
    const data = await response.json();
    if (data && data.ip) {
      ipEl.textContent = data.ip;
    } else {
      ipEl.textContent = 'your ip';
    }
  } catch (e) {
    ipEl.textContent = 'your ip';
  }
})();

/* ─────────────────────────────────────────────
   SPARKLES (entry screen)
───────────────────────────────────────────── */
const canvas = document.getElementById('sparkle-canvas');
const ctx    = canvas.getContext('2d');
let W, H;
const pts = [];

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

function spawn(x, y, n = 5) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = .3 + Math.random() * 1.6;
    pts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, a: 1, r: .8+Math.random()*2, life:0, max: 35+Math.random()*45 });
  }
}

let entryAlive = true;
setInterval(() => { if (entryAlive) spawn(Math.random()*W, Math.random()*H, 3); }, 55);
let mx=0, my=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; if (entryAlive) spawn(mx,my,3); });

(function loop() {
  ctx.clearRect(0,0,W,H);
  for (let i=pts.length-1;i>=0;i--) {
    const p=pts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.025; p.life++;
    p.a = 1-p.life/p.max;
    if (p.a<=0) { pts.splice(i,1); continue; }
    ctx.globalAlpha=p.a;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(loop);
})();

/* ─────────────────────────────────────────────
   ENTRY CLICK
───────────────────────────────────────────── */
const entry  = document.getElementById('entry');
const main   = document.getElementById('main');
const vid    = document.getElementById('bg-video');
const volSl  = document.getElementById('vol-slider');

entry.addEventListener('click', () => {
  entry.classList.add('hide');
  main.classList.add('show');
  entryAlive = false;
  vid.muted  = false;
  vid.volume = parseFloat(volSl.value);
  vid.play().catch(() => { vid.muted = true; vid.play(); });
  setTimeout(() => entry.remove(), 800);
});

/* ─────────────────────────────────────────────
   3-D TILT
───────────────────────────────────────────── */
const card  = document.getElementById('tiltCard');
const scene = card.closest('.tilt-scene');

function onMove(e) {
  const r   = scene.getBoundingClientRect();
  const cx  = r.left + r.width  / 2;
  const cy  = r.top  + r.height / 2;
  const dx  = (e.clientX - cx) / (r.width  / 2);
  const dy  = (e.clientY - cy) / (r.height / 2);
  const rotX = -dy * 12;
  const rotY =  dx * 12;

  card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  card.style.boxShadow = `${-rotY*2}px ${rotX*2}px 50px rgba(0,0,0,.75), 0 20px 60px rgba(0,0,0,.6)`;
  const mx = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
  const my = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
  card.style.setProperty('--mx', mx + '%');
  card.style.setProperty('--my', my + '%');
}

function onLeave() {
  card.style.transition = 'transform .5s ease, box-shadow .5s ease';
  card.style.transform  = 'rotateX(0deg) rotateY(0deg)';
  card.style.boxShadow  = '0 20px 60px rgba(0,0,0,.7), 0 4px 16px rgba(0,0,0,.5)';
}

scene.addEventListener('mousemove', e => {
  card.style.transition = 'transform .08s ease-out, box-shadow .08s ease-out';
  onMove(e);
});
scene.addEventListener('mouseleave', onLeave);

/* ─────────────────────────────────────────────
   AUDIO / VIDEO CONTROLS
───────────────────────────────────────────── */
const btnPlay    = document.getElementById('btn-play');
const icPlay     = document.getElementById('ic-play');
const icPause    = document.getElementById('ic-pause');
const progFill   = document.getElementById('prog-fill');
const progThumb  = document.getElementById('prog-thumb');
const progTrack  = document.getElementById('prog-track');
const tCur       = document.getElementById('t-cur');
const tDur       = document.getElementById('t-dur');
const btnMute    = document.getElementById('btn-mute');
const icVol      = document.getElementById('ic-vol');
const icMuted    = document.getElementById('ic-muted');
const btnRestart = document.getElementById('btn-restart');

function fmt(s) {
  s = Math.floor(s)||0;
  return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
}

vid.addEventListener('loadedmetadata', () => { tDur.textContent = fmt(vid.duration); });

vid.addEventListener('timeupdate', () => {
  if (!vid.duration) return;
  const p = (vid.currentTime / vid.duration) * 100;
  progFill.style.width  = p + '%';
  progThumb.style.left  = p + '%';
  tCur.textContent = fmt(vid.currentTime);
});

btnPlay.addEventListener('click', () => { vid.paused ? vid.play() : vid.pause(); });
vid.addEventListener('play',  () => { icPlay.style.display='none'; icPause.style.display=''; });
vid.addEventListener('pause', () => { icPause.style.display='none'; icPlay.style.display=''; });

progTrack.addEventListener('click', e => {
  const r = progTrack.getBoundingClientRect();
  vid.currentTime = ((e.clientX - r.left) / r.width) * vid.duration;
});

let dragging = false;
progTrack.addEventListener('mousedown', () => dragging = true);
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const r = progTrack.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  vid.currentTime = p * vid.duration;
});
document.addEventListener('mouseup', () => dragging = false);

volSl.addEventListener('input', () => {
  vid.volume = parseFloat(volSl.value);
  vid.muted  = vid.volume === 0;
  syncMute();
});

btnMute.addEventListener('click', () => {
  vid.muted = !vid.muted;
  volSl.value = vid.muted ? 0 : vid.volume || 1;
  syncMute();
});

function syncMute() {
  if (vid.muted || vid.volume === 0) {
    icVol.style.display='none'; icMuted.style.display='';
  } else {
    icMuted.style.display='none'; icVol.style.display='';
  }
}

btnRestart.addEventListener('click', () => { vid.currentTime = 0; });
</script>
</body>
</html>
